<title>谍报风云</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background-color: #0c0c0f;
    color: #e0d8cc;
    min-height: 100vh;
    padding: 30px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 560px; margin: 0 auto; }

  .title-area { text-align: center; margin-bottom: 40px; }

  .main-title {
    display: block;
    font-size: 26px;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 4px;
    color: #444444;
  }

  .sub-title {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #3d3d3d;
    font-style: italic;
  }

  .word-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-bottom: 15px;
  }

  .word-slot {
    width: 49%;
    min-height: 80px;
    margin-bottom: 8px;
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #141418;
    border: 1px solid #2a2824;
    border-radius: 6px;
  }

  .slot-number { font-size: 10px; color: #6b6358; }

  .slot-word {
    font-size: 16px;
    color: #e0d8cc;
    text-align: center;
    word-break: break-all;
    font-weight: 600;
  }

  .word-grid.is-hidden .slot-word { color: #6b6358; }

  .word-grid.is-locked .word-slot {
    border-color: #b8936e;
    box-shadow: 0 0 10px rgba(184, 147, 110, 0.5);
  }
  .word-grid.is-locked .slot-number { color: #d4b896; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 15px;
  }

  .btn-generate {
    background-color: #b71c2c;
    color: #f0d0c8;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  .btn-lock, .btn-hide {
    background-color: #1e1e24;
    color: #b0a89a;
    border: 1px solid #353330;
    border-radius: 6px;
    font-size: 14px;
    padding: 12px;
    cursor: pointer;
    letter-spacing: 2px;
  }

  .btn-lock.is-active {
    border-color: #b8936e;
    color: #d4b896;
    background: #1e1c18;
  }

  .btn-hide.is-active {
    border-color: #b71c2c;
    color: #f0d0c8;
    background: #1e1416;
  }

  .divider { height: 1px; background: #353330; margin: 20px 0; }

  .digit-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 10px;
    margin-bottom: 15px;
    border: 1px solid #5a3a30;
    border-radius: 8px;
    background: #1c1a15;
  }

  .digit-box {
    min-width: 50px;
    padding: 10px 0;
    text-align: center;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(180, 150, 120, 0.25);
    border-radius: 6px;
  }

  .digit-text {
    font-size: 30px;
    font-weight: 700;
    color: #e8d5b8;
    font-family: 'Consolas', monospace;
  }

  .digit-row.is-hidden .digit-text { color: #6b6358; }

  .digit-sep { font-size: 20px; color: #b8936e; }

  .seed-area {
    margin-top: 20px;
    padding: 14px;
    background: #141418;
    border: 1px solid #2a2824;
    border-radius: 6px;
  }

  .seed-current {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .seed-label { font-size: 12px; color: #6b6358; letter-spacing: 2px; }

  .seed-value {
    font-family: 'Consolas', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #e8d5b8;
    letter-spacing: 3px;
    user-select: all;
  }

  .seed-lookup { display: flex; gap: 8px; }

  .seed-input {
    flex: 1;
    background: #0c0c0f;
    border: 1px solid #353330;
    border-radius: 4px;
    padding: 10px;
    color: #e0d8cc;
    font-size: 14px;
    font-family: 'Consolas', monospace;
    letter-spacing: 2px;
    text-align: center;
    outline: none;
    text-transform: lowercase;
  }

  .seed-input:focus { border-color: #b8936e; }

  .btn-lookup {
    background-color: #1e1e24;
    color: #b0a89a;
    border: 1px solid #353330;
    border-radius: 4px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }

  .wordbank-status {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: #6b6358;
    letter-spacing: 1px;
  }

  @keyframes slotFlash {
    0%   { transform: scale(0.93); opacity: 0.4; }
    55%  { transform: scale(1.035); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .word-grid.is-flashing .word-slot {
    animation: slotFlash 0.42s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .word-grid.is-flashing .word-slot:nth-child(1) { animation-delay: 0s; }
  .word-grid.is-flashing .word-slot:nth-child(2) { animation-delay: 0.05s; }
  .word-grid.is-flashing .word-slot:nth-child(3) { animation-delay: 0.1s; }
  .word-grid.is-flashing .word-slot:nth-child(4) { animation-delay: 0.15s; }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #1a1210;
    border: 1px solid #b8936e;
    color: #e0d8cc;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 1px;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    pointer-events: none;
    max-width: 80vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>

      '轮滑鞋','平衡车','徒步背包','野餐垫','泡泡机','天文望远镜','星空海报','卡通手办','彩色气球','复古胶片',
      '香薰蜡烛','网球拍','排球','足球','滑板','飞镖','台球杆','滑翔伞','钓鱼椅','手账本',
      '油画颜料','仓鼠笼','郁金香','玫瑰','银杏','拼图','积木','手风琴','吉他'
    ]
  };

  /* ==================== 种子随机（只用于词语） ==================== */
  const SEED_CHARS = '23456789abcdefghjkmnpqrstuvwxyz';
  const SEED_LEN = 7;

  function stringToSeed(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = h << 13 | h >>> 19;
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function makeSeed() {
    let s = '';
    for (let i = 0; i < SEED_LEN; i++) {
      s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)];
    }
    return s;
  }

  /* ==================== 状态 ==================== */
  const state = {
    words: [],
    numbers: [],
    wordsLocked: false,
    wordsHidden: false,
    numbersHidden: false,
    seed: ''
  };

  /* ==================== DOM ==================== */
  const $ = id => document.getElementById(id);

  const toastEl = $('toast');
  const wordGrid = $('word-grid');
  const digitRow = $('digit-row');
  const wordEls = [0, 1, 2, 3].map(i => $('word-' + i));
  const digitEls = [0, 1, 2].map(i => $('digit-' + i));

  const btnRegenWords = $('btn-regen-words');
  const btnLockWords = $('btn-lock-words');
  const btnHideWords = $('btn-hide-words');
  const btnRegenNumbers = $('btn-regen-numbers');
  const btnHideNumbers = $('btn-hide-numbers');
  const btnLookup = $('btn-lookup');
  const seedInput = $('seed-input');

  /* ==================== Toast ==================== */
  let toastTimer = null;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  /* ==================== 抽取逻辑 ==================== */
  function pickWords(seedStr) {
    const rand = mulberry32(stringToSeed('w:' + seedStr));
    const categories = Object.keys(WORDBANK).slice();
    for (let i = categories.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = categories[i];
      categories[i] = categories[j];
      categories[j] = tmp;
    }
    const selectedCats = categories.slice(0, 4);
    return selectedCats.map(cat => {
      const list = WORDBANK[cat];
      return list[Math.floor(rand() * list.length)];
    });
  }

  function pickNumbers() {
    const arr = [1, 2, 3, 4];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr.slice(0, 3);
  }

  /* ==================== 渲染 ==================== */
  function renderWords() {
    wordEls.forEach((el, i) => {
      const word = state.words[i] || '';
      el.textContent = state.wordsHidden ? '••••' : (word || '—');
    });
    wordGrid.classList.toggle('is-hidden', state.wordsHidden);
    wordGrid.classList.toggle('is-locked', state.wordsLocked);
  }

  function renderNumbers() {
    digitEls.forEach((el, i) => {
      const num = state.numbers[i];
      el.textContent = state.numbersHidden ? '•' : (num === undefined ? '—' : num);
    });
    digitRow.classList.toggle('is-hidden', state.numbersHidden);
  }

  function renderSeed() {
    $('seed-display').textContent = state.seed || '-------';
  }

  function syncButtons() {
    btnLockWords.classList.toggle('is-active', state.wordsLocked);
    btnLockWords.textContent = state.wordsLocked ? '🔒 已锁定' : '🔓 锁定';

    btnHideWords.classList.toggle('is-active', state.wordsHidden);
    btnHideWords.textContent = state.wordsHidden ? '👁 显示' : '👁 隐藏';

    btnHideNumbers.classList.toggle('is-active', state.numbersHidden);
    btnHideNumbers.textContent = state.numbersHidden ? '👁 显示' : '👁 隐藏';
  }

  function flashWords() {
    wordGrid.classList.remove('is-flashing');
    void wordGrid.offsetWidth;
    wordGrid.classList.add('is-flashing');
    setTimeout(() => wordGrid.classList.remove('is-flashing'), 700);
  }

  /* ==================== 操作 ==================== */
  function regenerateWords() {
    if (state.wordsLocked) {
      showToast('词语已锁定，请先解锁');
      return;
    }
    state.seed = makeSeed();
    state.words = pickWords(state.seed);
    if (state.wordsHidden) { state.wordsHidden = false; syncButtons(); }
    renderWords();
    renderSeed();
    flashWords();
  }

  function toggleLockWords() {
    state.wordsLocked = !state.wordsLocked;
    renderWords();
    syncButtons();
    showToast(state.wordsLocked ? '词语已锁定' : '词语已解锁');
  }

  function toggleHideWords() {
    state.wordsHidden = !state.wordsHidden;
    renderWords();
    syncButtons();
    showToast(state.wordsHidden ? '词语已隐藏' : '词语已显示');
  }

  function regenerateNumbers() {
    state.numbers = pickNumbers();
    if (state.numbersHidden) { state.numbersHidden = false; syncButtons(); }
    renderNumbers();
  }

  function toggleHideNumbers() {
    state.numbersHidden = !state.numbersHidden;
    renderNumbers();
    syncButtons();
    showToast(state.numbersHidden ? '编号已隐藏' : '编号已显示');
  }

  function lookupSeed() {
    const val = (seedInput.value || '').trim().toLowerCase();
    if (val.length !== SEED_LEN) {
      showToast('请输入 7 位代码');
      return;
    }
    for (let i = 0; i < val.length; i++) {
      if (SEED_CHARS.indexOf(val[i]) === -1) {
        showToast('代码含无效字符，请核对');
        return;
      }
    }
    state.seed = val;
    state.words = pickWords(val);
    state.wordsLocked = false;
    state.wordsHidden = false;
    renderWords();
    renderSeed();
    syncButtons();
    flashWords();
    seedInput.value = '';
    showToast('已载入代码 ' + val);
  }

  /* ==================== 事件绑定 ==================== */
  btnRegenWords.addEventListener('click', regenerateWords);
  btnLockWords.addEventListener('click', toggleLockWords);
  btnHideWords.addEventListener('click', toggleHideWords);
  btnRegenNumbers.addEventListener('click', regenerateNumbers);
  btnHideNumbers.addEventListener('click', toggleHideNumbers);
  btnLookup.addEventListener('click', lookupSeed);
  seedInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') lookupSeed();
  });

  /* ==================== 初始化 ==================== */
  function init() {
    const total = Object.values(WORDBANK).reduce((sum, arr) => sum + arr.length, 0);
    $('wordbank-count').textContent = total;
    state.seed = makeSeed();
    state.words = pickWords(state.seed);
    state.numbers = pickNumbers();
    renderWords();
    renderNumbers();
    renderSeed();
    syncButtons();
  }

  init();
})();
</script>
</body>
</html>
